name: Keep Render Backend Alive

on:
  schedule:
    # Every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:   # lets you trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ping backend health endpoint
        run: |
          URL="https://aics-mentor-backend.onrender.com/health"
          # Two pings, 5 minutes apart = 10 minutes of activity per run.
          # Scheduled every 10 minutes, so the backend never has a 15-min quiet gap.
          for i in 1 2; do
            echo "Ping $i at $(date -u +%H:%M:%S) UTC"
            curl -sSf --max-time 90 "$URL" && echo "  → OK" || echo "  → FAILED"
            if [ $i -lt 2 ]; then
              sleep 300
            fi
          done